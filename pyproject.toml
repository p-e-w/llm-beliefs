[project]
name = "llm-beliefs"
version = "0.1.0"
description = "Visualizing the geopolitical beliefs of language models"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Philipp Emanuel Weidmann", email = "pew@worldwidemann.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.46.0",
    "pycountry>=26.2.16",
]

[project.scripts]
llm-beliefs = "llm_beliefs:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
